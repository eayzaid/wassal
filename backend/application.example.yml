# ==============================================================================
# Wassal Platform — Exemplary Backend Configuration Template
# Copy this file to application.yml or set the corresponding environment variables.
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wassal-user-management

  datasource:
    # Default connects to local Docker container (docker compose up -d)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wassal_db}
    username: ${DB_USER:wassal_user}
    password: ${DB_PASSWORD:wassal_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/migration-pg

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Provide your SMTP credentials via environment variables:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ==============================================================================
# Wassal Domain & Security Settings
# ==============================================================================
wassal:
  # Automatically seed 8 mock test accounts (president, vp, rh, etc.) on clean DB
  seed-mock-data: ${SEED_MOCK_DATA:true}

  jwt:
    # 256-bit secret key in base64 / hex format (override in production!)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-seconds: 604800 # 7 days
    cookie-same-site: Strict
    cookie-secure: false

  mail:
    # Sender address for transactional emails
    from: ${MAIL_FROM:noreply@wassal.org}
    login-url: ${LOGIN_URL:http://localhost:3000/login}
    # When true, emails are safely logged to console instead of dispatched via SMTP
    mock-mode: ${MAIL_MOCK_MODE:true}

  contact:
    default-name: Wassal Administration
    default-email: contact@wassal.org
    default-phone: "+212500000000"

  cors:
    allowed-origins:
      - "*"

  rate-limit:
    # Rate limit on /api/auth/* endpoints (Bucket4j token bucket)
    auth-requests-per-minute: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
