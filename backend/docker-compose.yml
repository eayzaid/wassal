version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wassal-postgres
    environment:
      POSTGRES_DB: wassal_db
      POSTGRES_USER: wassal_user
      POSTGRES_PASSWORD: wassal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
